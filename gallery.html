<!DOCTYPE html>
<html lang="ko"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>갤러리</title>
    <!-- 구글 폰트: Orbitron, Noto Sans KR -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&amp;family=Orbitron:wght@600;800;900&amp;display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050508;
            --card-bg: rgba(14, 16, 27, 0.85);
            --neon-pink: #ff0055;
            --neon-cyan: #00f3ff;
            --neon-yellow: #ffe600;
            --neon-purple: #b026ff;
            --neon-green: #00ff66;
            --text-color: #f1f5f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Noto Sans KR', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px;
            overflow-x: hidden;
            position: relative;
        }

        /* TV 스캔라인 효과 */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 10;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        /* 동적 3D 그리드 배경 */
        .cyber-grid-3d {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: 
                linear-gradient(transparent 95%, var(--neon-cyan) 100%),
                linear-gradient(90deg, transparent 95%, rgba(0, 243, 255, 0.3) 100%);
            background-size: 40px 40px;
            opacity: 0.15;
            z-index: 0;
            animation: gridMove 8s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translateY(0); }
            100% { transform: translateY(40px); }
        }

        /* 네온 네뷸라 블러 배경 효과 */
        .neon-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.35;
            animation: floatOrb 10s infinite ease-in-out alternate;
        }
        .orb-1 { width: 300px; height: 300px; background: var(--neon-pink); top: -50px; left: -50px; }
        .orb-2 { width: 350px; height: 350px; background: var(--neon-purple); bottom: -100px; right: -50px; animation-delay: -5s; }
        .orb-3 { width: 250px; height: 250px; background: var(--neon-cyan); top: 40%; left: 50%; transform: translate(-50%, -50%); opacity: 0.2; }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 40px) scale(1.2); }
        }

        /* 메인 컨테이너 */
        .container {
            width: 100%;
            max-width: 720px;
            z-index: 2;
            display: flex;
            flex-direction: column;
            gap: 32px;
            padding-bottom: 40px;
        }

        /* 헤더 & 글리치 / 바운스 애니메이션 */
        header {
            text-align: center;
            padding: 35px 15px;
            background: rgba(14, 16, 27, 0.7);
            border: 2px solid var(--neon-cyan);
            border-radius: 16px;
            box-shadow: 
                0 0 20px rgba(0, 243, 255, 0.4),
                inset 0 0 20px rgba(0, 243, 255, 0.2);
            backdrop-filter: blur(12px);
            position: relative;
            overflow: hidden;
        }

        /* 사이버 코너 가이드 라인 */
        header::before, header::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border: 3px solid var(--neon-pink);
        }
        header::before { top: 0; left: 0; border-right: none; border-bottom: none; }
        header::after { bottom: 0; right: 0; border-left: none; border-top: none; }

        .system-tag {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            color: var(--neon-yellow);
            letter-spacing: 3px;
            margin-bottom: 12px;
            text-shadow: 0 0 8px var(--neon-yellow);
        }

        /* 바운스 + 네온 Glow */
        .bounce-title {
            display: inline-block;
            font-size: 2.6rem;
            font-weight: 900;
            position: relative;
        }

        .bounce-title span {
            display: inline-block;
            animation: bounce 1.1s infinite ease-in-out alternate;
            text-shadow: 
                0 0 10px currentColor,
                0 0 25px currentColor;
        }

        .bounce-title span:nth-child(1) { animation-delay: 0.0s; color: var(--neon-cyan); }
        .bounce-title span:nth-child(2) { animation-delay: 0.1s; color: #fff; }
        .bounce-title span:nth-child(3) { animation-delay: 0.2s; color: var(--neon-pink); }
        .bounce-title span:nth-child(4) { animation-delay: 0.3s; color: var(--neon-yellow); }
        .bounce-title span:nth-child(5) { animation-delay: 0.4s; color: var(--neon-green); }
        .bounce-title span:nth-child(6) { animation-delay: 0.5s; color: var(--neon-purple); }
        .bounce-title span:nth-child(7) { animation-delay: 0.6s; color: var(--neon-pink); }

        @keyframes bounce {
            0% { transform: translateY(0) scale(1) rotate(0deg); }
            100% { transform: translateY(-20px) scale(1.15) rotate(2deg); }
        }

        .sub-status {
            margin-top: 15px;
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 700;
            letter-spacing: 1px;
        }

        .sub-status span {
            color: var(--neon-cyan);
            border-bottom: 1px dashed var(--neon-cyan);
        }

        /* 섹션 공통 스타일 */
        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--neon-cyan);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 0 10px var(--neon-cyan);
            letter-spacing: 1px;
        }

        .section-title::before {
            content: '▶';
            color: var(--neon-pink);
            font-size: 1rem;
            animation: blink 1s infinite alternate;
        }

        @keyframes blink {
            0% { opacity: 0.2; }
            100% { opacity: 1; }
        }

        /* 좋아하는 것 3가지 (플립 카드) */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 18px;
        }

        .card-container {
            perspective: 1000px;
            height: 200px;
            cursor: pointer;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
            border-radius: 14px;
        }

        .card-container:hover .card {
            box-shadow: 0 0 25px var(--neon-pink);
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 18px;
            text-align: center;
            border: 2px solid var(--neon-pink);
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 12px rgba(255, 0, 85, 0.25);
        }

        .card-front {
            background: linear-gradient(135deg, rgba(22, 24, 40, 0.95), rgba(40, 10, 50, 0.95));
        }

        .card-front .icon {
            font-size: 3.2rem;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 12px var(--neon-pink));
            animation: iconPulse 2s infinite ease-in-out;
        }

        @keyframes iconPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .card-front h3 {
            font-size: 1.3rem;
            color: #fff;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .card-front .hint {
            font-size: 0.75rem;
            color: var(--neon-yellow);
            margin-top: 10px;
            font-weight: 700;
            padding: 4px 8px;
            border: 1px solid var(--neon-yellow);
            border-radius: 12px;
            background: rgba(255, 230, 0, 0.1);
        }

        .card-back {
            transform: rotateY(180deg);
            background: linear-gradient(135deg, rgba(0, 243, 255, 0.15), rgba(10, 15, 30, 0.95));
            border-color: var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
        }

        .card-back p {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #fff;
            word-break: keep-all;
            font-weight: 700;
        }

        /* OX 퀴즈 섹션 */
        .quiz-card {
            background: var(--card-bg);
            border: 2px solid var(--neon-purple);
            border-radius: 16px;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 0 20px rgba(176, 38, 255, 0.3);
            position: relative;
            backdrop-filter: blur(10px);
            transition: border-color 0.3s;
        }

        .quiz-question {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 22px;
            line-height: 1.5;
            word-break: keep-all;
            color: #fff;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }

        .quiz-btn-group {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .quiz-btn {
            flex: 1;
            max-width: 130px;
            padding: 14px 0;
            font-size: 1.6rem;
            font-weight: 900;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-family: 'Orbitron', sans-serif;
            position: relative;
            overflow: hidden;
        }

        .btn-o {
            background: rgba(0, 243, 255, 0.1);
            color: var(--neon-cyan);
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }

        .btn-o:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 25px var(--neon-cyan);
            transform: scale(1.05);
        }

        .btn-x {
            background: rgba(255, 0, 85, 0.1);
            color: var(--neon-pink);
            border: 2px solid var(--neon-pink);
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.2);
        }

        .btn-x:hover {
            background: var(--neon-pink);
            color: #fff;
            box-shadow: 0 0 25px var(--neon-pink);
            transform: scale(1.05);
        }

        .quiz-btn:active {
            transform: scale(0.95);
        }

        .quiz-result {
            margin-top: 18px;
            font-size: 1.1rem;
            font-weight: 900;
            min-height: 30px;
            letter-spacing: 0.5px;
        }

        /* 점심 메뉴 슬롯 머신 버튼 */
        .lunch-card {
            background: var(--card-bg);
            border: 2px solid var(--neon-yellow);
            border-radius: 16px;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 230, 0, 0.25);
            backdrop-filter: blur(10px);
        }

        .lunch-display {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--neon-yellow);
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 18px 0;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 10px;
            border: 2px dashed var(--neon-yellow);
            text-shadow: 0 0 12px var(--neon-yellow);
            transition: transform 0.2s;
            letter-spacing: 1px;
        }

        .cyber-btn {
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: 900;
            font-family: 'Noto Sans KR', sans-serif;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
            transition: all 0.3s ease;
            width: 100%;
            max-width: 280px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .cyber-btn:hover {
            box-shadow: 0 0 35px var(--neon-pink), 0 0 10px var(--neon-cyan);
            transform: translateY(-3px) scale(1.02);
        }

        .cyber-btn:active {
            transform: translateY(1px);
        }

        /* 축하 파티클 Canvas */
        #fx-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 999;
        }

        /* 오답 레드 경고 흔들림 */
        .shake-error {
            animation: glitchError 0.5s ease-in-out;
            border-color: var(--neon-pink) !important;
            box-shadow: 0 0 30px var(--neon-pink) !important;
        }

        @keyframes glitchError {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-15px) rotate(-1deg); }
            40% { transform: translateX(15px) rotate(1deg); }
            60% { transform: translateX(-10px); }
            80% { transform: translateX(10px); }
        }

        /* 반응형 디바이스 맞춤 */
        @media (max-width: 480px) {
            .bounce-title {
                font-size: 1.85rem;
            }
            .cards-grid {
                grid-template-columns: 1fr;
            }
            .card-container {
                height: 165px;
            }
            .quiz-question {
                font-size: 1rem;
            }
            .lunch-display {
                font-size: 1.25rem;
            }
        }
    </style>
<style data-studio="css">
:root{--st-accent:#e2557a}
.st-nav{position:sticky;top:0;z-index:50;width:100%;box-sizing:border-box;background:#fff;background:rgba(255,255,255,.93);backdrop-filter:blur(6px);border-bottom:1px solid rgba(0,0,0,.08)}
.st-nav-in{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:10px 12px;max-width:960px;margin:0 auto}
.st-nav-a{display:inline-block;padding:8px 14px;border-radius:999px;text-decoration:none;color:#333;font-weight:700;font-size:15px;line-height:1.2}
.st-nav-a:hover{background:rgba(0,0,0,.06)}
.st-nav-a.is-on{background:var(--st-accent);color:#fff}
.st-sec{box-sizing:border-box;width:100%;max-width:960px;margin:24px auto;padding:20px}
.st-h{font-size:1.6rem;font-weight:800;line-height:1.3;margin:0 0 12px}
.st-p{font-size:1rem;line-height:1.75;margin:0 0 12px}
.st-btn{display:inline-block;padding:12px 22px;border-radius:12px;background:var(--st-accent);color:#fff!important;text-decoration:none;font-weight:700;font-size:1rem;line-height:1.2;border:0;cursor:pointer;margin:4px}
.st-btn:hover{filter:brightness(1.08)}
.st-img{margin:16px auto;text-align:center}
.st-img img{display:inline-block;width:100%;max-width:100%;height:auto;border-radius:12px}
.st-hero{text-align:center;padding:48px 20px;border-radius:20px;background:#f6f6f6;background:color-mix(in srgb,var(--st-accent) 12%,#fff)}
.st-hero .st-h{font-size:2rem}
.st-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.st-card{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:16px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.05);text-align:left}
.st-ico{font-size:2rem;line-height:1;margin:0 0 8px}
.st-card .st-h{font-size:1.15rem;margin:0 0 6px}
.st-card .st-p{margin:0;font-size:.95rem}
.st-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:20px;align-items:center}

.st-split img{display:block;width:100%;height:auto;border-radius:16px}
.st-list{margin:0;padding-left:1.3em;line-height:1.9}
.st-hr{border:0;border-top:2px dashed rgba(0,0,0,.15);margin:28px auto;max-width:960px}
.st-foot{text-align:center;font-size:.875rem;opacity:.7;padding:24px 12px}
.st-tab-bar{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid rgba(0,0,0,.08);margin-bottom:14px}
.st-tab{border:0;background:none;padding:10px 14px;font:inherit;font-weight:700;color:inherit;opacity:.6;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.st-tab.is-on{opacity:1;color:var(--st-accent);border-bottom-color:var(--st-accent)}
.st-acc{border:1px solid rgba(0,0,0,.1);border-radius:12px;margin:8px 0;background:#fff;overflow:hidden;text-align:left}
.st-acc summary{cursor:pointer;padding:14px 44px 14px 16px;font-weight:700;list-style:none;position:relative}
.st-acc summary::-webkit-details-marker{display:none}
.st-acc summary::after{content:"+";position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:1.3em;color:var(--st-accent)}
.st-acc[open] summary::after{content:"\2212"}
.st-acc>.st-p{padding:0 16px 14px;margin:0}
.st-pop{margin:12px 0;text-align:center}
.st-modal{border:0;border-radius:18px;padding:24px;width:min(480px,90vw);box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:left;color:#222}
.st-modal::backdrop{background:rgba(0,0,0,.45)}
.st-slider{position:relative}
.st-slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:16px}
.st-slides::-webkit-scrollbar{display:none}
.st-slide{flex:0 0 100%;scroll-snap-align:start;margin:0}
.st-slide img{display:block;width:100%;height:auto;aspect-ratio:16/10;object-fit:cover;border-radius:16px}
.st-slide figcaption{text-align:center;padding:8px;font-size:.95rem}
.st-prev,.st-next{position:absolute;top:calc(50% - 40px);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.92);box-shadow:0 2px 8px rgba(0,0,0,.2);font-size:24px;line-height:1;cursor:pointer;color:#333}

.st-dots button.is-on{background:var(--st-accent)}
.st-quiz{text-align:center}
.st-q{font-size:1.25rem;font-weight:800;margin:0 0 14px}
.st-opts{display:grid;gap:8px;max-width:420px;margin:0 auto}

.st-qr{min-height:1.6em;font-weight:700;margin:12px 0 0}
.st-ci{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid rgba(0,0,0,.08);border-radius:10px;margin:6px 0;background:#fff;cursor:pointer;text-align:left;color:#222}
.st-ci input{width:20px;height:20px;flex:none;accent-color:var(--st-accent)}
.st-bar{height:10px;border-radius:99px;background:rgba(0,0,0,.08);overflow:hidden;margin-top:12px}
.st-bar i{display:block;height:100%;width:0;background:var(--st-accent);transition:width .3s}
.st-cnt{font-size:.9rem;opacity:.75;margin:6px 0 0}
.st-dday,.st-timer{text-align:center;border-radius:20px;background:#f6f6f6;background:color-mix(in srgb,var(--st-accent) 10%,#fff)}
.st-dlabel,.st-tlabel{margin:0;font-weight:700;opacity:.8}
.st-dnum,.st-tnum{margin:4px 0 8px;font-size:3rem;font-weight:900;color:var(--st-accent);font-variant-numeric:tabular-nums;line-height:1.2}
.st-tnum.is-done{animation:stblink 1s 3}@keyframes stblink{50%{opacity:.2}}
.st-embed iframe{display:block;width:100%;aspect-ratio:16/9;height:auto;border:0;border-radius:14px}
.st-embed[data-kind=map] iframe{aspect-ratio:4/3}
.st-cols{display:grid;gap:16px}
.st-c2{grid-template-columns:repeat(2,minmax(0,1fr))}.st-c3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:600px){.st-c2,.st-c3{grid-template-columns:1fr}}
.st-col{min-width:0}
.st-swipe{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 4px 14px;-webkit-overflow-scrolling:touch}
